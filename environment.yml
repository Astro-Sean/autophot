name: autophot
channels:
  - conda-forge
  - astro-sean
  - defaults
dependencies:
  - python==3.12.*
  - numpy==2.4.6
  - pandas==3.0.1
  - scikit-image==0.26.0
  - matplotlib==3.10.9
  - scipy==1.17.1
  - scikit-learn==1.9.0
  - astropy==8.0.1
  - astroquery==0.4.11
  - photutils==3.1.*
  - lmfit==1.3.4
  - emcee==3.1.6
  - astroscrappy==1.2.0
  - reproject==0.20.0
  - pyvo==1.9.1
  - pyyaml==6.0.3
  - requests==2.34.2
  - tqdm==4.68.2
  - corner==2.2.3
  - ccdproc==2.5.1
  - astroalign==2.6.2
  # sip_tpv==1.1 does `import pkg_resources`, which setuptools removed in 81.
  - setuptools<81
  - astromatic-source-extractor
  - astromatic-scamp
  - astromatic-swarp
  - pip
  - pip:
    - aafitrans==0.2.1
    - mastcasjobs==0.0.7
    - sfft==1.7.3
    - spalipy>=3.5
    - sip_tpv==1.1
