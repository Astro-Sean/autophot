{% set name = "autophot" %}
{% set version = "1.1.22" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../..

# Pin channels so conda-build only searches conda-forge, not defaults.
# Without this, conda-build processes both channels' repodata, which doubles
# the solver time for the host environment.
channels:
  - conda-forge

# IMPORTANT: This package requires conda-forge channel
# Install with: conda install -c conda-forge -c astro-sean autophot
# Or add conda-forge to your channels: conda config --add channels conda-forge
#
# sfft and sip_tpv are pip-only (not on conda-forge) and have compiled Cython
# extensions that are platform-specific.  They are NOT bundled in this package
# to preserve the noarch: python declaration.  After conda install, run:
#   pip install sfft==1.7.3 sip_tpv==1.1

build:
  noarch: python
  # Increment when re-publishing the same package version to Anaconda (avoids 409 conflict).
  number: 3

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.11,<3.13
    - astroalign >=2.6.2
    - astropy >=7.0
    - astroquery >=0.4.11
    - astromatic-source-extractor
    - astromatic-scamp
    - astromatic-swarp
    - astroscrappy ==1.2.0
    - corner >=2.2.3
    - ccdproc >=2.5.1
    - emcee >=3.1.6
    - lmfit >=1.3.4
    - matplotlib >=3.10
    - numpy >=2.0
    - pandas >=3.0
    - photutils >=3.0
    - pyyaml >=6.0
    - reproject >=0.20
    - requests >=2.34
    - scikit-image >=0.24
    - scikit-learn >=1.9
    - scipy >=1.17
    - tqdm >=4.68
    # SFFT dependencies (available on conda-forge) — needed because sfft
    # is installed via pip by the user, and pip needs these conda packages
    # to already be present for sfft's compiled extensions to work.
    - fastremap >=1.20
    - llvmlite >=0.36
    - numba >=0.53
    - pyfftw >=0.12
    - sep >=1.0
    # sfft==1.7.3 and sip_tpv==1.1 are pip-only (not on conda-forge).
    # They are NOT bundled in this package (would break noarch: python).
    # Users must install them separately after conda install:
    #   pip install sfft==1.7.3 sip_tpv==1.1
    - pip

test:
  imports:
    - main
    - templates
    - utils
    - databases
  commands:
    - autophot-main -h
  requires:
    - python >=3.11,<3.13

about:
  home: https://github.com/Astro-Sean/autophot
  dev_url: https://github.com/Astro-Sean/autophot
  doc_url: https://ui.adsabs.harvard.edu/abs/2022A&A...667A..62B
  summary: Automated photometry pipeline for transient astronomy, including calibrated aperture/PSF photometry, template subtraction, and light-curve-ready outputs for CCD/NIR imaging.
  license: MIT
  license_file: LICENSE

